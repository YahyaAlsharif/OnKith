<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onkith chat screen v1</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../../assets/player/archivo-regular-v1.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Archivo";
    src: url("../../assets/player/archivo-medium-v1.ttf") format("truetype");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "Archivo";
    src: url("../../assets/player/archivo-semibold-v1.ttf") format("truetype");
    font-weight: 600;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../../assets/player/ibm-plex-mono-v1.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --void: #080706;
    --surface: #131110;
    --raise: #1c1917;
    --hairline: #252220;
    --hairline-lit: #3a3532;
    --ink: #f5f2ee;
    --ink-2: #8d8781;
    --ink-3: #56514d;
    --hold: #f5f2ee;
    --hold-wash: rgba(245, 242, 238, 0.07);
    --lift: #ff5a36;
    --lift-dim: #a85337;
    --lift-wash: rgba(255, 90, 54, 0.12);
    --lift-dim-wash: rgba(168, 83, 55, 0.14);
    --display: "Archivo", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --s1: 4px;
    --s2: 8px;
    --s3: 12px;
    --s4: 16px;
    --s5: 24px;
    --s6: 32px;
    --s7: 48px;
    --s8: 64px;
    --r: 2px;
    --r-lg: 4px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    block-size: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: var(--display);
    /* A voice device is looked at, never scrolled. */
    overflow: hidden;
  }

  .screen {
    block-size: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: minmax(0, 1fr) 0fr;
    transition: grid-template-columns 420ms cubic-bezier(0.2, 0, 0, 1);
  }
  .screen[data-player="open"] { grid-template-columns: minmax(0, 1fr) minmax(0, 0.62fr); }

  /* ---------------------------------------------------------------- crown */

  .crown {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: var(--s4);
    padding: var(--s4) var(--s6);
    border-block-end: 1px solid var(--hairline);
  }

  .chip {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: var(--r);
    background: var(--hold-wash);
    color: var(--hold);
    white-space: nowrap;
  }
  .chip[data-gate="sent"] { background: var(--lift-dim-wash); color: #c4714f; }
  .chip[data-gate="blocked"] { background: var(--lift-wash); color: var(--lift); }

  .crown-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-inline-start: auto;
  }

  /* ------------------------------------------------------------------ pet */

  /* The pet is the mark itself rather than a character. The brand rules out
     eyes, and sitr is a cover that holds, so the states live in the
     relationship between the three parts of the eave: the cover stays put,
     and the sheltered block underneath is what moves. */
  .pet { inline-size: 48px; block-size: 48px; flex: none; display: block; }
  .pet rect { fill: var(--ink); }
  .pet .sheltered { transform-box: fill-box; transform-origin: center; }

  /* resting: nothing moves. Silence is the product working. */

  /* listening: the block breathes under a cover that does not. */
  [data-pet="listening"] .pet .sheltered { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.74); opacity: 0.55; }
  }

  /* thinking: stepping, not spinning. A spinner belongs to a page load. */
  [data-pet="thinking"] .pet .sheltered { animation: step 1.05s steps(1, end) infinite; }
  @keyframes step {
    0% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-2.2px, 0) scale(0.82); }
    50% { transform: translate(0, -1.6px) scale(1); }
    75% { transform: translate(2.2px, 0) scale(0.82); }
  }

  /* speaking: the block rides the output level. */
  [data-pet="speaking"] .pet .sheltered { animation: voice 0.44s ease-in-out infinite; }
  @keyframes voice {
    0%, 100% { transform: scaleY(0.62); }
    50% { transform: scaleY(1.12); }
  }

  /* The only coloured states, and only while the gate is actually acting.
     Vermillion stays reserved: routine traffic is the dim intensity. */
  [data-gate="sent"] .pet .wall { fill: var(--lift-dim); }
  [data-gate="blocked"] .pet .wall,
  [data-gate="blocked"] .pet .sheltered { fill: var(--lift); }

  @media (prefers-reduced-motion: reduce) {
    .pet .sheltered { animation: none !important; }
  }

  /* --------------------------------------------------------- conversation */

  .talk {
    position: relative;
    min-inline-size: 0;
    padding: var(--s6) var(--s6) var(--s7);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: var(--s5);
    overflow: hidden;
  }

  /* The threshold rule, used for what it is defined to mean: what is left of
     it stayed on this device, what is right of it left and came back. */
  .talk::before {
    content: "";
    position: absolute;
    inset-block: var(--s5);
    inset-inline-start: 42%;
    inline-size: 1px;
    background: var(--hairline-lit);
  }

  .turn {
    max-inline-size: 38ch;
    transition: opacity 300ms ease, transform 300ms ease;
  }
  .turn[data-role="room"] {
    align-self: flex-start;
    max-inline-size: 34%;
    font-family: var(--mono);
    font-size: clamp(13px, 1.15vw, 16px);
    line-height: 1.55;
    color: var(--ink-2);
  }
  .turn[data-role="onkith"] {
    align-self: flex-end;
    margin-inline-start: 46%;
    font-family: var(--display);
    font-weight: 500;
    letter-spacing: -0.015em;
    font-size: clamp(20px, 2.5vw, 34px);
    line-height: 1.22;
    color: var(--ink);
  }

  /* Older turns rise and recede rather than scrolling away, so the newest
     exchange is always the largest thing on the screen. */
  .turn[data-age="1"] { opacity: 0.62; }
  .turn[data-age="2"] { opacity: 0.34; }
  .turn[data-age="3"] { opacity: 0.16; }
  .turn[data-age="4"] { opacity: 0.07; }
  .turn[data-age="1"][data-role="onkith"] { font-size: clamp(17px, 1.9vw, 25px); }
  .turn[data-age="2"][data-role="onkith"] { font-size: clamp(15px, 1.5vw, 20px); }
  .turn[data-age="3"][data-role="onkith"],
  .turn[data-age="4"][data-role="onkith"] { font-size: clamp(14px, 1.2vw, 17px); }

  .turn-tag {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-block-end: var(--s2);
  }

  /* What the room is saying right now, before it has been finalised. */
  .live {
    align-self: flex-start;
    max-inline-size: 34%;
    font-family: var(--mono);
    font-size: clamp(13px, 1.15vw, 16px);
    line-height: 1.55;
    color: var(--ink-3);
    min-block-size: 1.55em;
  }
  .live::after {
    content: "";
    display: inline-block;
    inline-size: 7px;
    block-size: 1em;
    background: var(--ink-3);
    vertical-align: text-bottom;
    margin-inline-start: 3px;
    animation: caret 1.1s steps(1, end) infinite;
  }
  [data-pet="listening"] .live::after { background: var(--ink-2); }
  @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* --------------------------------------------------------- player panel */

  .player {
    min-inline-size: 0;
    border-inline-start: 1px solid var(--hairline);
    background: var(--surface);
    padding: var(--s5);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: var(--s4);
    opacity: 0;
    transition: opacity 260ms ease 120ms;
  }
  [data-player="open"] .player { opacity: 1; }

  .player-stage {
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    display: grid;
    place-items: center;
    min-block-size: 0;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: center;
    padding: var(--s4);
  }

  .player-title {
    font-size: clamp(15px, 1.5vw, 19px);
    font-weight: 500;
    letter-spacing: -0.015em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .player-artist {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-block-start: var(--s1);
  }

  .meter {
    block-size: 2px;
    background: var(--hairline);
    border-radius: var(--r);
    overflow: hidden;
  }
  .meter span { display: block; block-size: 100%; inline-size: 34%; background: var(--lift-dim); }

  .times {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-3);
    margin-block-start: var(--s2);
  }

  /* --------------------------------------------------- narrow and portrait */

  @media (max-aspect-ratio: 1/1), (max-width: 720px) {
    .screen, .screen[data-player="open"] {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) 0fr;
    }
    .screen[data-player="open"] { grid-template-rows: auto minmax(0, 1fr) minmax(0, 0.45fr); }
    /* Two columns cannot hold a threshold at this width, so the roles are
       carried by type and indentation instead. */
    .talk::before { display: none; }
    .talk { padding: var(--s5) var(--s4) var(--s6); }
    .turn[data-role="room"], .live { max-inline-size: 78%; }
    .turn[data-role="onkith"] { margin-inline-start: 12%; max-inline-size: 88%; }
    .player { border-inline-start: 0; border-block-start: 1px solid var(--hairline); }
  }

  /* ------------------------------------------------- mockup controls only */

  .rig {
    position: fixed;
    inset-block-end: 0;
    inset-inline: 0;
    display: flex;
    flex-wrap: wrap;
    gap: var(--s2);
    padding: var(--s3) var(--s4);
    background: rgba(8, 7, 6, 0.94);
    border-block-start: 1px solid var(--hairline);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .rig strong { color: var(--ink-3); font-weight: 400; align-self: center; margin-inline-end: var(--s2); }
  .rig button {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--hairline-lit);
    border-radius: var(--r);
    padding: 6px 12px;
    cursor: pointer;
  }
  .rig button:hover { background: var(--raise); border-color: var(--ink-3); color: var(--ink); }
  .rig button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); background: var(--raise); }
  .rig button:focus-visible { outline: 2px solid var(--lift); outline-offset: 2px; }
  body[data-rig="off"] .rig { display: none; }
</style>
</head>
<body data-rig="on">
  <div class="screen" id="screen" data-pet="resting" data-gate="held" data-player="closed">

    <header class="crown">
      <svg class="pet" viewBox="0 0 24 24" role="img" aria-label="Onkith">
        <rect class="cover" x="2.6" y="3.4" width="18.8" height="2.8" rx="0.6"/>
        <rect class="wall" x="18.6" y="3.4" width="2.8" height="17" rx="0.6"/>
        <rect class="sheltered" x="7.6" y="10.6" width="7.6" height="7.6" rx="1"/>
      </svg>
      <span class="chip" id="chip" data-gate="held">Held</span>
      <span class="crown-label" id="crownState">Resting</span>
    </header>

    <section class="talk" id="talk" aria-live="polite">
      <div class="turn" data-role="room" data-age="3">
        <span class="turn-tag">Room</span>
        put something on
      </div>
      <div class="turn" data-role="onkith" data-age="2">
        Playing Bones by Imagine Dragons.
      </div>
      <div class="turn" data-role="room" data-age="1">
        <span class="turn-tag">Room</span>
        onkith what time does the library close
      </div>
      <div class="turn" data-role="onkith" data-age="0">
        Most branches shut at six on weekdays. I cannot check yours from here.
      </div>
      <div class="live" id="live"></div>
    </section>

    <aside class="player" aria-label="Now playing">
      <div>
        <div class="player-title">Imagine Dragons Bones</div>
        <div class="player-artist">Pizza Music</div>
      </div>
      <div class="player-stage">Recorder<br>goes here</div>
      <div>
        <div class="meter"><span></span></div>
        <div class="times"><span>00:54</span><span>02:42</span></div>
      </div>
    </aside>
  </div>

  <div class="rig">
    <strong>Pet</strong>
    <button type="button" data-pet-state="resting" aria-pressed="true">Resting</button>
    <button type="button" data-pet-state="listening" aria-pressed="false">Listening</button>
    <button type="button" data-pet-state="thinking" aria-pressed="false">Thinking</button>
    <button type="button" data-pet-state="speaking" aria-pressed="false">Speaking</button>
    <strong>Gate</strong>
    <button type="button" data-gate-state="held" aria-pressed="true">Held</button>
    <button type="button" data-gate-state="sent" aria-pressed="false">Sent</button>
    <button type="button" data-gate-state="blocked" aria-pressed="false">Blocked</button>
    <strong>Screen</strong>
    <button type="button" id="togglePlayer" aria-pressed="false">Player panel</button>
    <button type="button" id="runScene">Play a whole exchange</button>
    <button type="button" id="hideRig">Hide this bar</button>
  </div>

<script>
  const screen = document.getElementById("screen");
  const chip = document.getElementById("chip");
  const crownState = document.getElementById("crownState");
  const talk = document.getElementById("talk");
  const live = document.getElementById("live");

  const GATE_LABEL = { held: "Held", sent: "Sent", blocked: "Blocked" };
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function setPet(state) {
    screen.dataset.pet = state;
    crownState.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    document.querySelectorAll("[data-pet-state]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.petState === state));
    });
  }

  function setGate(state) {
    screen.dataset.gate = state;
    chip.dataset.gate = state;
    chip.textContent = GATE_LABEL[state];
    document.querySelectorAll("[data-gate-state]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.gateState === state));
    });
  }

  // Turns age upward rather than scrolling, so only the newest five are kept.
  function addTurn(role, text) {
    talk.querySelectorAll(".turn").forEach((turn) => {
      const age = Number(turn.dataset.age) + 1;
      if (age > 4) turn.remove();
      else turn.dataset.age = String(age);
    });
    const turn = document.createElement("div");
    turn.className = "turn";
    turn.dataset.role = role;
    turn.dataset.age = "0";
    if (role === "room") {
      const tag = document.createElement("span");
      tag.className = "turn-tag";
      tag.textContent = "Room";
      turn.append(tag);
    }
    turn.append(document.createTextNode(text));
    talk.insertBefore(turn, live);
  }

  async function typeLive(text) {
    live.textContent = "";
    for (const character of text) {
      live.textContent += character;
      await wait(38);
    }
  }

  document.querySelectorAll("[data-pet-state]").forEach((button) => {
    button.addEventListener("click", () => setPet(button.dataset.petState));
  });
  document.querySelectorAll("[data-gate-state]").forEach((button) => {
    button.addEventListener("click", () => setGate(button.dataset.gateState));
  });

  const togglePlayer = document.getElementById("togglePlayer");
  togglePlayer.addEventListener("click", () => {
    const open = screen.dataset.player === "open";
    screen.dataset.player = open ? "closed" : "open";
    togglePlayer.setAttribute("aria-pressed", String(!open));
  });

  document.getElementById("hideRig").addEventListener("click", () => {
    document.body.dataset.rig = "off";
  });

  let running = false;
  document.getElementById("runScene").addEventListener("click", async () => {
    if (running) return;
    running = true;
    setGate("held");
    setPet("listening");
    await typeLive("onkith what was that band called");
    await wait(320);
    live.textContent = "";
    addTurn("room", "onkith what was that band called");
    setPet("thinking");
    // Masked text leaving for the model is a sanctioned transfer, which is
    // the dim intensity. Full vermillion stays reserved for the gate acting.
    setGate("sent");
    await wait(1400);
    setGate("held");
    setPet("speaking");
    addTurn("onkith", "Imagine Dragons. The track was Bones.");
    await wait(2600);
    setPet("resting");
    running = false;
  });

  setPet("resting");
  setGate("held");
</script>
</body>
</html>
